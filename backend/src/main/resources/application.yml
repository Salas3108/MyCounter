spring:
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/yourdb}
    username: ${DB_USERNAME:postgres}
    password: ${DB_PASSWORD:postgres}
  jpa:
    hibernate:
      ddl-auto: update
    properties:
      hibernate:
        format_sql: true
    open-in-view: false
  sql:
    init:
      mode: never

server:
  port: 8080

app:
  jwt:
    secret: ${JWT_SECRET:change-me-in-prod}
    issuer: example-auth
    expirationMinutes: 60
